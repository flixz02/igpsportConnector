[package]
name = "bsc200-tool"
version = "0.1.0"
edition = "2021"
description = "Cross-platform companion app for the iGPSPORT BSC200 bike computer"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37"
egui-file-dialog = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
prost = "0.14"
gpx = "0.10"
quick-xml = "0.38"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
geo-types = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-trait = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
dbus = { version = "0.9", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
btleplug = "0.13"

[profile.release]
opt-level = 2
lto = "thin"
